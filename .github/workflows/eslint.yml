name: ESLint Analysis

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  schedule:
    - cron: '37 18 * * 3'
  workflow_dispatch:

# Belt-and-suspenders: if a push ever does land while a PR sharing the same
# branch is already open and its check hasn't started yet, this lets the
# later run cancel the earlier one instead of both running. Doesn't help the
# far more common case below (jobs' `if:`), where the two runs are minutes
# apart rather than concurrent.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  eslint:
    name: Run ESLint Scanning
    # Skip only the auto-generated develop-head bookkeeping PR into main (a bot
    # recreates it after every merge) - that commit was already fully tested by
    # the push trigger above, often minutes before this PR is even opened. Any
    # other PR (a real feature branch, into develop or directly into main)
    # still runs normally.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'develop' || github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: src/HotelPOS.Client/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: src/HotelPOS.Client

      - name: Run ESLint and generate SARIF report
        run: npm run lint
        working-directory: src/HotelPOS.Client
        continue-on-error: true

      - name: Upload ESLint SARIF results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
